name: Advanced Deploy to Portainer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if no changes detected'
        required: false
        default: false
        type: boolean

env:
  PORTAINER_WEBHOOK_URL: "http://portainer.davidperezmillan.com/api/stacks/webhooks/1e5f595f-f205-4ae0-b2ff-ff007a535e80"

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Portainer Stack
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit info
        id: commit
        run: |
          echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=%an)" >> $GITHUB_OUTPUT

      - name: Deploy to Portainer with retry
        id: deploy
        run: |
          echo "🚀 Starting deployment to Portainer..."
          echo "📝 Commit: ${{ steps.commit.outputs.sha }} by ${{ steps.commit.outputs.author }}"
          echo "💬 Message: ${{ steps.commit.outputs.message }}"
          echo "🔗 Webhook URL: $PORTAINER_WEBHOOK_URL"
          echo ""
          
          # Función para hacer la petición
          deploy_attempt() {
            local attempt=$1
            echo "📡 Attempt $attempt: Triggering deployment..."
            
            response=$(curl -s -w "\n%{http_code}" -X POST \
              --connect-timeout 30 \
              --max-time 60 \
              "$PORTAINER_WEBHOOK_URL")
            
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | head -n -1)
            
            echo "   HTTP Code: $http_code"
            if [ ! -z "$body" ]; then
              echo "   Response: $body"
            fi
            
            return $http_code
          }
          
          # Intentar deployment con reintentos
          max_attempts=3
          attempt=1
          success=false
          
          while [ $attempt -le $max_attempts ] && [ "$success" = false ]; do
            deploy_attempt $attempt
            exit_code=$?
            
            if [ $exit_code -eq 200 ] || [ $exit_code -eq 204 ]; then
              echo "✅ Deployment successful on attempt $attempt!"
              success=true
            elif [ $attempt -lt $max_attempts ]; then
              echo "⚠️  Attempt $attempt failed, retrying in 10 seconds..."
              sleep 10
              attempt=$((attempt + 1))
            else
              echo "❌ All $max_attempts attempts failed"
              exit 1
            fi
          done
          
          echo ""
          echo "🎉 Deployment completed successfully!"

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Repository** | \`${{ github.repository }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ steps.commit.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Author** | ${{ steps.commit.outputs.author }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Message** | ${{ steps.commit.outputs.message }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Portainer** | [View Dashboard](http://portainer.davidperezmillan.com) |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ job.status }}" == "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ✅ Next Steps" >> $GITHUB_STEP_SUMMARY
            echo "1. Check the [Portainer dashboard](http://portainer.davidperezmillan.com) for stack status" >> $GITHUB_STEP_SUMMARY
            echo "2. Verify that the new version is running correctly" >> $GITHUB_STEP_SUMMARY
            echo "3. Monitor application logs if needed" >> $GITHUB_STEP_SUMMARY
          fi