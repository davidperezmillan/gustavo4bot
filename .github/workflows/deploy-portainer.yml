name: Deploy to Portainer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      
      - name: Run tests with pytest
        env:
          TELEGRAM_TOKEN: "test_token"
          OWNER_ID: "123456789"
          CHAT_SOURCE_ID: "-1001234567890"
          PUBLISH_CHANNEL_ID: "-1001234567891"
          STORAGE_CHANNEL_ID: "-1001234567892"
          LOG_LEVEL: "DEBUG"
        run: |
          pytest --verbose --cov=bot --cov-report=term-missing
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Portainer Stack
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via Portainer Webhook
        run: |
          echo "🚀 Triggering deployment to Portainer..."
          
          response=$(curl -s -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            "http://portainer.davidperezmillan.com/api/stacks/webhooks/1e5f595f-f205-4ae0-b2ff-ff007a535e80")
          
          http_code="${response: -3}"
          
          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 204 ]; then
            echo "✅ Deployment triggered successfully (HTTP $http_code)"
            echo "📦 Stack is being updated in Portainer"
          else
            echo "❌ Deployment failed with HTTP code: $http_code"
            echo "Response: ${response%???}"
            exit 1
          fi

      - name: Deployment notification
        run: |
          echo "🎉 Deployment process completed!"
          echo "📍 Check your Portainer dashboard for the updated stack"
          echo "🔗 Portainer URL: http://portainer.davidperezmillan.com"