name: Tests Only

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    name: Test Python ${{ matrix.python-version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      
      - name: Install additional testing tools
        run: |
          pip install flake8 black isort mypy
      
      - name: Check code formatting with black
        run: |
          black --check bot tests
        continue-on-error: true
      
      - name: Check imports with isort
        run: |
          isort --check-only bot tests
        continue-on-error: true
      
      - name: Lint with flake8
        run: |
          flake8 bot tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 bot tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true
      
      - name: Type check with mypy
        run: |
          mypy bot --ignore-missing-imports
        continue-on-error: true
      
      - name: Run tests
        env:
          TELEGRAM_TOKEN: "test_token_${{ matrix.python-version }}"
          OWNER_ID: "123456789"
          CHAT_SOURCE_ID: "-1001234567890"
          PUBLISH_CHANNEL_ID: "-1001234567891"
          STORAGE_CHANNEL_ID: "-1001234567892"
          LOG_LEVEL: "DEBUG"
        run: |
          pytest --verbose \
            --cov=bot \
            --cov-report=term-missing \
            --cov-report=xml:coverage-${{ matrix.python-version }}.xml \
            --junitxml=test-results-${{ matrix.python-version }}.xml
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: coverage-${{ matrix.python-version }}.xml
          flags: python-${{ matrix.python-version }}
          name: codecov-python-${{ matrix.python-version }}
        continue-on-error: true
      
      - name: Upload test artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: |
            test-results-${{ matrix.python-version }}.xml
            coverage-${{ matrix.python-version }}.xml
            htmlcov/

  test-summary:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    
    steps:
      - name: Test Summary
        run: |
          echo "## 📊 Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Python Version | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------------|--------|" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            echo "| 3.9 | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "| 3.10 | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "| 3.11 | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 All tests passed across all Python versions!" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Some versions | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ Some tests failed. Check the individual job results." >> $GITHUB_STEP_SUMMARY
          fi