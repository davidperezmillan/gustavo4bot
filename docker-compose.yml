version: '3.8'

services:
  gustavo4bot:
    build: .
    container_name: gustavo4_bot
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - OWNER_ID=${OWNER_ID}
      - CHAT_SOURCE_ID=${CHAT_SOURCE_ID}
      - PUBLISH_CHANNEL_ID=${PUBLISH_CHANNEL_ID}
      - STORAGE_CHANNEL_ID=${STORAGE_CHANNEL_ID}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Europe/Madrid}
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  bot-network:
    driver: bridge