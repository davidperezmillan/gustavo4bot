version: '3.8'

services:
  gustavo4bot:
    image: gustavo4bot:latest
    container_name: gustavo4_bot
    restart: unless-stopped
    environment:
      # Token del bot de Telegram
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      
      # IDs de configuración
      OWNER_ID: ${OWNER_ID}
      CHAT_SOURCE_ID: ${CHAT_SOURCE_ID}
      PUBLISH_CHANNEL_ID: ${PUBLISH_CHANNEL_ID}
      STORAGE_CHANNEL_ID: ${STORAGE_CHANNEL_ID}
      
      # Configuración adicional
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-Europe/Madrid}
    
    volumes:
      - gustavo4bot_logs:/app/logs
    
    networks:
      - gustavo4bot_network
    
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys; sys.exit(0)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  gustavo4bot_logs:
    driver: local

networks:
  gustavo4bot_network:
    driver: overlay
    attachable: true